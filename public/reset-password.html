<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/css/premium-styles.css">
  <link rel="stylesheet" href="/css/app-messages.css?v=1">
  <script src="/js/app-messages.js?v=1"></script>
</head>
<body>
  <div class="container" style="max-width: 400px; margin: 3rem auto;">
    <h2>Reset Your Password</h2>
    <form id="requestForm" autocomplete="on">
      <div class="form-group">
        <label for="email">Your account email</label>
        <input type="email" id="email" name="email" class="input" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary">Get Reset Link</button>
    </form>
    <form id="resetForm" autocomplete="on" style="display:none">
      <input type="hidden" id="token" name="token" autocomplete="off">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" class="input" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
    <div id="resetMessage" style="margin-top: 1rem;"></div>
  </div>
  <script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const msgEl = document.getElementById('resetMessage');
    if (urlParams.get('token')) {
      document.getElementById('token').value = urlParams.get('token');
      document.getElementById('requestForm').style.display = 'none';
      document.getElementById('resetForm').style.display = '';
    }

    document.getElementById('requestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      msgEl.textContent = 'Please wait...';
      try {
        const res = await fetch('/api/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value })
        });
        const data = await res.json();
        showAppMessage(data.message || 'Error.', { type: res.ok ? 'success' : 'error' });
        if (data.resetUrl) {
          const a = document.createElement('a');
          a.href = data.resetUrl;
          a.textContent = ' Reset my password';
          msgEl.appendChild(a);
        }
      } catch (err) {
        showAppMessage('Network error. Try again.', { type: 'error' });
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/password-reset/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        showAppMessage(data.message || 'Error resetting password.', { type: res.ok ? 'success' : 'error' });
      } catch (err) {
        showAppMessage('Network error. Try again.', { type: 'error' });
      }
    });
  </script>
</body>
</html>
